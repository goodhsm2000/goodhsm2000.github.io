# this file uses prebuilt image in dockerhub
services:
  jekyll:
    image: amirpourmand/al-folio:v0.15.0
    build: .
    ports:
      - 8080:8080
      - 35729:35729
    volumes:
      - .:/srv/jekyll
    environment:
      - JEKYLL_ENV=development
    command: >
      bash -lc "bundle exec jekyll serve
      --host 0.0.0.0
      --port 8080
      --livereload
      --livereload-port 35729
      --force_polling
      --incremental"
